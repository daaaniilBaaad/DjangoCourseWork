{% extends "mailsendler/base.html" %}
{% load static %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title mb-4 text-center">Регистрация</h3>

                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
                    </form>

                    <hr>

                    <p class="text-center">
                        Уже есть аккаунт? <a href="{% url 'users:login' %}">Войти</a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
