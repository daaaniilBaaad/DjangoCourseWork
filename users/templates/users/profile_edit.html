{% extends 'mailsendler/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Редактирование профиля</h2>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-success">Сохранить</button>
                <a href="{% url 'users:profile' %}" class="btn btn-secondary ms-2">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
