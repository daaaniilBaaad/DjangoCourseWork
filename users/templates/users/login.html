{% extends "mailsendler/base.html" %}
{% load static %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title mb-4 text-center">Вход</h3>
                    <form method="post">
                    {% csrf_token %}
                    {{form.as_p}}
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <hr>
                <p class="text-center">
                    <a href="{% url 'users:password_reset' %}">Забыли пароль?</a><br>
                    <a href="{% url 'users:register' %}">Регистрация</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
