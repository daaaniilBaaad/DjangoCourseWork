{% extends 'mailsendler/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Список сообщений</h1>

    <a href="{% url 'mailsendler:message_create' %}" class="btn btn-success mb-3">Создать сообщение</a>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Тема</th>
                <th>Владелец</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for message in object_list %}
            <tr>
                <td>{{ message.id }}</td>
                <td>{{ message.subject }}</td>
                <td>{{ message.owner.username }}</td>
                <td>
                    <a href="{% url 'mailsendler:message_update' message.id %}" class="btn btn-sm btn-primary">Редактировать</a>
                    <a href="{% url 'mailsendler:message_delete' message.id %}" class="btn btn-sm btn-danger">Удалить</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">Сообщений нет</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
