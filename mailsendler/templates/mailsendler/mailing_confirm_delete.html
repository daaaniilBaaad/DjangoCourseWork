{% extends 'mailsendler/base.html' %}
{% block title %}Удалить рассылку{% endblock %}

{% block content %}
<h1>Удалить рассылку?</h1>
<p>Вы уверены, что хотите удалить рассылку "{{ mailing.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'mailsendler:mailing_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
